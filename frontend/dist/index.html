<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <title>Komi Go</title>
  <link rel="stylesheet" href="styles.css?v=0.4.6" />
</head>
<body>
  <svg class="sprite" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
    <symbol id="i-compass" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M15.6 8.4 13.7 13.7 8.4 15.6 10.3 10.3Z"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.2"/><path d="M15.2 15.2 20 20"/></symbol>
    <symbol id="i-apps" viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><rect x="13" y="13" width="7" height="7" rx="2"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v10"/><path d="M8 10.5 12 14.5 16 10.5"/><path d="M5 18.5h14"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><path d="M4 7h9"/><path d="M17 7h3"/><circle cx="15" cy="7" r="2.2"/><path d="M4 17h3"/><path d="M11 17h9"/><circle cx="9" cy="17" r="2.2"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M19 8.5A7.5 7.5 0 0 0 6.2 6.5"/><path d="M5 12.5A7.5 7.5 0 0 0 17.8 18"/><path d="M19 4.5v4h-4"/><path d="M5 19.5v-4h4"/></symbol>
    <symbol id="i-external" viewBox="0 0 24 24"><path d="M13 5h6v6"/><path d="M19 5 11 13"/><path d="M18 15v3a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h3"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5 9.5 17 19 7.5"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6 18 18"/><path d="M18 6 6 18"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 4.5 21 19.5H3Z"/><path d="M12 10v4"/><circle cx="12" cy="17" r=".9"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 11v5"/><circle cx="12" cy="8" r=".9"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M4 7h7l2 2h7v9H4z"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M5 7h14"/><path d="M8 7V5h8v2"/><path d="M7 7l1 13h8l1-13"/></symbol>
    <symbol id="i-pin" viewBox="0 0 24 24"><path d="M9 4h6l-1 6 4 3v2H6v-2l4-3-1-6Z"/><path d="M12 15v5"/></symbol>
    <symbol id="i-skip" viewBox="0 0 24 24"><path d="M5 6 13 12 5 18Z"/><path d="M16 6v12"/></symbol>
    <symbol id="i-key" viewBox="0 0 24 24"><circle cx="8" cy="12" r="4"/><path d="M12 12h9"/><path d="M17 12v3"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5 18 12 8 18.5Z"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><path d="M9 6v12"/><path d="M15 6v12"/></symbol>
    <symbol id="i-minus" viewBox="0 0 24 24"><path d="M6 12h12"/></symbol>
    <symbol id="i-square" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1.5"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="M7 10 12 15 17 10"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M14 5 7 12l7 7"/></symbol>
    <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 4.5l2.3 4.7 5.2.8-3.8 3.7.9 5.2-4.6-2.5-4.6 2.5.9-5.2-3.8-3.7 5.2-.8Z"/></symbol>
    <symbol id="i-code" viewBox="0 0 24 24"><path d="M8.5 7 4 12l4.5 5"/><path d="M15.5 7 20 12l-4.5 5"/><path d="M13 5l-2 14"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="11" height="11" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 4l7 2.5V12c0 4.2-2.9 7-7 8-4.1-1-7-3.8-7-8V6.5Z"/><path d="M9 12.2 11 14l4-4"/></symbol>
    <symbol id="i-power" viewBox="0 0 24 24"><path d="M12 4v8"/><path d="M7 6.5a7 7 0 1 0 10 0"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14"/><path d="M5 12h14"/></symbol>
    <symbol id="i-filter" viewBox="0 0 24 24"><path d="M4 6h16"/><path d="M7 12h10"/><path d="M10 18h4"/></symbol>
    <symbol id="i-tag" viewBox="0 0 24 24"><path d="M4 4h7l9 9-7 7-9-9Z"/><circle cx="8.5" cy="8.5" r="1.3"/></symbol>
    <symbol id="i-inbox" viewBox="0 0 24 24"><path d="M4 13 7 5h10l3 8v6H4Z"/><path d="M4 13h5l1.5 3h3L15 13h5"/></symbol>
  </svg>

  <div class="app">
    <header class="titlebar">
      <div class="titlebar-drag" style="--wails-draggable: drag">
        <div class="brand-mark" aria-hidden="true"><span>K</span></div>
        <div class="brand-text">
          <span class="brand-name">Komi Go</span>
          <span class="brand-sub">GitHub Release Store</span>
        </div>
        <span class="version-chip" id="versionChip">v0.3.0</span>
      </div>
      <div class="window-actions" style="--wails-draggable: no-drag">
        <button class="win-btn" data-action="win-min" aria-label="最小化" data-tip="最小化">
          <svg class="icon" aria-hidden="true"><use href="#i-minus"/></svg>
        </button>
        <button class="win-btn" data-action="win-max" aria-label="最大化" data-tip="最大化">
          <svg class="icon" aria-hidden="true"><use href="#i-square"/></svg>
        </button>
        <button class="win-btn win-close" data-action="win-close" aria-label="关闭" data-tip="关闭到托盘或退出">
          <svg class="icon" aria-hidden="true"><use href="#i-close"/></svg>
        </button>
      </div>
    </header>

    <div class="shell">
      <nav class="rail" aria-label="主导航">
        <div class="rail-top">
          <button class="rail-item" data-route="discover" aria-current="page">
            <span class="rail-indicator"><svg class="icon" aria-hidden="true"><use href="#i-compass"/></svg></span>
            <span class="rail-label">发现</span>
          </button>
          <button class="rail-item" data-route="library">
            <span class="rail-indicator"><svg class="icon" aria-hidden="true"><use href="#i-apps"/></svg><span class="nav-badge" id="railUpdateBadge" hidden>0</span></span>
            <span class="rail-label">应用库</span>
          </button>
          <button class="rail-item" data-route="downloads">
            <span class="rail-indicator"><svg class="icon" aria-hidden="true"><use href="#i-download"/></svg><span class="nav-badge" id="railDownloadBadge" hidden>0</span></span>
            <span class="rail-label">下载</span>
          </button>
          <button class="rail-item" data-route="settings">
            <span class="rail-indicator"><svg class="icon" aria-hidden="true"><use href="#i-settings"/></svg></span>
            <span class="rail-label">设置</span>
          </button>
        </div>
        <div class="rail-categories" aria-label="应用分类">
          <div class="rail-section-label">分类</div>
          <button class="category-item" data-action="category" data-category="all"><span class="category-dot"></span><span>全部</span></button>
          <button class="category-item" data-action="category" data-category="ai"><span class="category-dot"></span><span>人工智能</span></button>
          <button class="category-item" data-action="category" data-category="privacy"><span class="category-dot"></span><span>隐私</span></button>
          <button class="category-item" data-action="category" data-category="network"><span class="category-dot"></span><span>网络</span></button>
          <button class="category-item" data-action="category" data-category="media"><span class="category-dot"></span><span>媒体</span></button>
          <button class="category-item" data-action="category" data-category="social"><span class="category-dot"></span><span>社交</span></button>
          <button class="category-item" data-action="category" data-category="reading"><span class="category-dot"></span><span>阅读</span></button>
          <button class="category-item" data-action="category" data-category="tool"><span class="category-dot"></span><span>工具</span></button>
        </div>
        <div class="rail-spacer"></div>
        <button class="rail-account" id="railAccount" data-action="account" data-tip="GitHub 账户">未登录</button>
        <div class="rail-foot" id="railFoot">Win32 · WebView2</div>
      </nav>

      <main id="main" class="content" tabindex="-1"></main>
    </div>

    <div class="loading-line" id="loadingLine" hidden><svg class="icon" aria-hidden="true"><use href="#i-refresh"/></svg><span>正在处理…</span></div>
    <div id="toastStack" class="toast-stack" role="status" aria-live="polite"></div>
    <div id="modalRoot"></div>
    <div id="onboardingRoot"></div>
  </div>

  <script src="app.js?v=0.4.6"></script>
</body>
</html>
